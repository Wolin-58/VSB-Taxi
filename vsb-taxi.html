<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VŠB Taxi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #0a0716;
    --navy-mid: #241c4d;
    --purple: #4a3f9e;
    --purple-light: #6a5cc4;
    --cream: #ede9df;
    --cream-dark: #d9d4c4;
    --teal: #3f7566;
    --teal-dark: #2e5a4e;
    --ink: #211c33;
    --white: #ffffff;
    --muted: rgba(255,255,255,0.62);
    --danger: #c15a4a;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 10px;
  }

  /* Fixed brand theme intentionally — the taxi splash identity stays
     constant regardless of system light/dark preference, but we still
     declare both blocks explicitly per platform convention. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: var(--navy-deep);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--white);
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .app-shell {
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* ---------- WELCOME / LOGIN ---------- */

  .welcome-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    padding: 40px 32px;
    background: radial-gradient(120% 90% at 50% -10%, var(--purple-light) 0%, var(--purple) 32%, var(--navy-mid) 62%, var(--navy-deep) 100%);
    text-align: center;
    position: relative;
  }

  .brand-mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .brand-word {
    font-family: 'Baloo 2', 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(40px, 11vw, 52px);
    letter-spacing: 0.5px;
    color: var(--white);
  }

  .brand-sub {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 3px;
    color: var(--cream);
  }

  .taxi-badge {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  .auth-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .name-input {
    width: 100%;
    padding: 15px 20px;
    border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,0.35);
    background: rgba(255,255,255,0.08);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    text-align: center;
    outline: none;
  }
  .name-input::placeholder { color: var(--muted); }
  .name-input:focus { border-color: var(--white); background: rgba(255,255,255,0.14); }

  .btn-pill {
    width: 100%;
    padding: 16px 20px;
    border-radius: 999px;
    border: none;
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .btn-pill:active { transform: scale(0.98); }
  .btn-pill:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  .link-btn {
    background: none;
    border: none;
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }
  .link-btn:focus-visible { outline: 2px solid var(--white); }

  .form-hint {
    font-size: 12px;
    color: var(--muted);
    max-width: 280px;
    line-height: 1.5;
  }

  .credit-line {
    position: absolute;
    bottom: 18px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(120,150,220,0.85);
  }

  .screen { display: none; }
  .screen.active { display: flex; flex-direction: column; }

  /* ---------- DASHBOARD ---------- */

  .dashboard {
    flex: 1;
    background: var(--navy-deep);
  }

  .dash-header {
    background: linear-gradient(160deg, var(--purple-light), var(--purple) 55%, var(--navy-mid));
    padding: 22px 22px 26px;
    border-radius: 0 0 30px 30px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .dash-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .user-row { display: flex; align-items: center; gap: 10px; }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--white);
    flex-shrink: 0;
  }

  .user-name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 16px;
  }

  .today-label {
    font-size: 12px;
    color: var(--cream);
    text-align: right;
    line-height: 1.4;
  }

  .logout-link {
    background: none; border: none;
    color: var(--muted);
    font-size: 11px;
    text-decoration: underline;
    cursor: pointer;
    align-self: flex-end;
    margin-top: -10px;
  }

  .week-pills {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .pill-day {
    padding: 10px 0;
    border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: var(--white);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
  }
  .pill-day.selected {
    background: var(--white);
    color: var(--purple);
    border-color: var(--white);
  }
  .pill-day:disabled { opacity: 0.35; cursor: default; }
  .pill-day:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }

  .log-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .leg-btn {
    padding: 13px 0;
    border-radius: 14px;
    border: none;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
    background: rgba(255,255,255,0.14);
    color: var(--white);
    border: 1.5px solid rgba(255,255,255,0.3);
  }
  .leg-btn.on {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--white);
  }
  .leg-btn:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  .leg-btn:disabled { opacity: 0.35; cursor: default; }

  .selected-day-note {
    font-size: 12px;
    color: var(--cream);
    text-align: center;
  }

  /* ---------- CALENDAR CARD ---------- */

  .cal-card {
    margin: -14px 16px 24px;
    background: var(--cream);
    border-radius: var(--radius-lg);
    padding: 18px 18px 22px;
    color: var(--ink);
    box-shadow: 0 20px 40px rgba(0,0,0,0.35);
  }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .nav-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--cream-dark);
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }

  .cal-month-label {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-transform: capitalize;
  }

  .cal-stat {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .cal-stat-label {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 20px;
  }

  .cal-stat-value {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--teal-dark);
  }

  .weekday-row, .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .weekday-row {
    margin-bottom: 8px;
  }

  .weekday-row span {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    color: rgba(33,28,51,0.5);
  }

  .day-cell {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid rgba(33,28,51,0.12);
    background: var(--white);
    overflow: hidden;
    cursor: pointer;
    padding: 0;
  }
  .day-cell.pad { visibility: hidden; cursor: default; pointer-events: none; }
  .day-cell:disabled { cursor: not-allowed; opacity: 0.4; }
  .day-cell:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }

  .day-cell .half {
    position: absolute;
    top: 0; bottom: 0;
    width: 50%;
    background: transparent;
  }
  .day-cell .half-left { left: 0; }
  .day-cell .half-right { right: 0; }
  .day-cell[data-tam="1"] .half-left { background: var(--teal); }
  .day-cell[data-zpet="1"] .half-right { background: var(--teal); }

  .day-num {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-size: 11px;
    font-weight: 500;
    color: var(--ink);
  }
  .day-cell[data-tam="1"] .day-num,
  .day-cell[data-zpet="1"] .day-num { color: var(--white); text-shadow: 0 1px 2px rgba(0,0,0,0.25); }

  .day-cell.is-today { box-shadow: inset 0 0 0 2px var(--purple); }
  .day-cell.is-selected { box-shadow: inset 0 0 0 2px var(--teal-dark); }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 16px;
    font-size: 11px;
    color: rgba(33,28,51,0.65);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: 1px solid rgba(33,28,51,0.15);
    position: relative;
    overflow: hidden;
    background: var(--white);
    flex-shrink: 0;
  }
  .legend-swatch .half { position: absolute; top:0; bottom:0; width:50%; background: var(--teal); }
  .legend-swatch.full .half { width: 100%; }
  .legend-swatch.left .half { left: 0; }
  .legend-swatch.right .half { right: 0; left: auto; }
  .legend-swatch.empty .half { display: none; }

  /* ---------- COST CARD ---------- */

  .cost-card {
    margin: 0 16px 28px;
  }

  .cost-title {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 14px;
  }

  .cost-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .cost-inputs label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 600;
    color: rgba(33,28,51,0.6);
    line-height: 1.3;
  }

  .cost-inputs input {
    padding: 9px 8px;
    border-radius: 10px;
    border: 1.5px solid rgba(33,28,51,0.15);
    background: var(--white);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    width: 100%;
  }
  .cost-inputs input:focus {
    outline: none;
    border-color: var(--teal-dark);
  }

  .cost-note {
    font-size: 11px;
    color: rgba(33,28,51,0.55);
    line-height: 1.5;
    margin: 0 0 16px;
  }

  .cost-total {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid rgba(33,28,51,0.12);
  }

  .cost-total span:first-child {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 16px;
  }

  #cost-total-value {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--teal-dark);
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-shell">

  <!-- WELCOME -->
  <section id="screen-welcome" class="screen active welcome-screen">
    <div class="taxi-badge">🚕</div>
    <div class="brand-mark">
      <span class="brand-word">welcome</span>
      <span class="brand-sub">VŠB TAXI</span>
    </div>
    <div class="auth-form">
      <button class="btn-pill" id="btn-go-login">Login</button>
      <button class="link-btn" id="btn-go-register">Register</button>
    </div>
    <div class="credit-line">CREDIT BY WOOLIN INC</div>
  </section>

  <!-- LOGIN / REGISTER (Supabase — účet a data jsou v cloudu) -->
  <section id="screen-auth" class="screen welcome-screen">
    <div class="brand-mark">
      <span class="brand-word" style="font-size:32px;" id="auth-title">Login</span>
    </div>
    <div class="auth-form">
      <input class="name-input" id="email-input" type="email" placeholder="E-mail" autocomplete="username">
      <input class="name-input" id="password-input" type="password" placeholder="Heslo" autocomplete="current-password">
      <button class="btn-pill" id="btn-confirm-auth">Pokračovat</button>
      <button class="link-btn" id="btn-back-welcome">Zpět</button>
      <p class="form-hint" id="auth-error"></p>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="screen-dashboard" class="screen dashboard">
    <div class="dash-header">
      <div class="dash-header-top">
        <div class="user-row">
          <div class="avatar" id="avatar-initial">A</div>
          <span class="user-name" id="header-username">Uživatel</span>
        </div>
        <div class="today-label" id="header-date"></div>
      </div>

      <div class="week-pills" id="week-pills"></div>

      <div class="log-actions">
        <button class="leg-btn" id="btn-tam">TAM</button>
        <button class="leg-btn" id="btn-zpet">ZPĚT</button>
      </div>
      <div class="selected-day-note" id="selected-day-note"></div>
      <button class="logout-link" id="btn-logout">odhlásit se</button>
    </div>

    <div class="cal-card">
      <div class="cal-nav">
        <button class="nav-btn" id="btn-prev-month" aria-label="Předchozí měsíc">←</button>
        <span class="cal-month-label" id="cal-month-label"></span>
        <button class="nav-btn" id="btn-next-month" aria-label="Následující měsíc">→</button>
      </div>
      <div class="cal-stat">
        <span class="cal-stat-label">Tento měsíc</span>
        <span class="cal-stat-value" id="cal-stat-value">0 jízd</span>
      </div>
      <div class="weekday-row">
        <span>Po</span><span>Út</span><span>St</span><span>Čt</span><span>Pá</span><span>So</span><span>Ne</span>
      </div>
      <div class="day-grid" id="day-grid"></div>
      <div class="legend">
        <div class="legend-item"><span class="legend-swatch empty"></span> žádná jízda</div>
        <div class="legend-item"><span class="legend-swatch left"><span class="half"></span></span> jel tam</div>
        <div class="legend-item"><span class="legend-swatch right"><span class="half"></span></span> jel zpět</div>
        <div class="legend-item"><span class="legend-swatch full"><span class="half"></span></span> tam i zpět</div>
      </div>
    </div>

    <div class="cal-card cost-card">
      <div class="cost-title">Náklady na jízdy</div>
      <div class="cost-inputs">
        <label>Benzin (Kč/l)
          <input type="number" id="input-fuel-price" min="0" step="0.1" inputmode="decimal">
        </label>
        <label>Spotřeba (l/100 km)
          <input type="number" id="input-consumption" min="0" step="0.1" inputmode="decimal">
        </label>
        <label>Vzdálenost tam (km)
          <input type="number" id="input-distance" min="0" step="0.5" inputmode="decimal">
        </label>
      </div>
      <p class="cost-note">Trasa Opava východ → VŠB Ostrava. Vzdálenost je jen odhad — uprav si ji podle skutečnosti, hodnoty se uloží.</p>
      <div class="cost-total">
        <span>Tento měsíc</span>
        <span id="cost-total-value">0 Kč</span>
      </div>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://khajfeunqnjpuaejlyvg.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_0Il7kBQuUEqjLMfnQxWGLg_hmZ372fS";
  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var WEEKDAY_LABELS = ["Po", "Út", "St", "Čt", "Pá"];
  var MONTH_NAMES = ["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];

  var DEFAULT_SETTINGS = { fuelPrice: 35, consumption: 6.5, distanceKm: 22 };

  var state = {
    user: null,
    rides: {},
    settings: Object.assign({}, DEFAULT_SETTINGS),
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth(),
    selectedDate: null,
    monthLegs: 0
  };

  var authMode = "login";

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function toKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function sameDay(a, b) { return toKey(a) === toKey(b); }
  function startOfToday() { var d = new Date(); d.setHours(0,0,0,0); return d; }

  // Rides can only be logged for today or yesterday — anything older is view-only.
  function isEditableDate(d) {
    var today = startOfToday();
    var yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    return d.getTime() === today.getTime() || d.getTime() === yesterday.getTime();
  }

  // ---------- Supabase data access ----------
  async function loadRidesFromCloud() {
    var userRes = await supabase.auth.getUser();
    var user = userRes.data.user;
    if (!user) return;
    var res = await supabase.from("rides").select("*").eq("user_id", user.id);
    state.rides = {};
    (res.data || []).forEach(function (row) {
      state.rides[row.ride_date] = { tam: row.tam, zpet: row.zpet };
    });
  }

  async function saveRideToCloud(dateKey, entry) {
    var userRes = await supabase.auth.getUser();
    var user = userRes.data.user;
    if (!user) return;
    var res = await supabase.from("rides").upsert({
      user_id: user.id,
      ride_date: dateKey,
      tam: entry.tam,
      zpet: entry.zpet
    });
    if (res.error) console.error(res.error);
  }

  async function loadSettingsFromCloud() {
    var userRes = await supabase.auth.getUser();
    var user = userRes.data.user;
    if (!user) return;
    var res = await supabase.from("settings").select("*").eq("user_id", user.id).maybeSingle();
    if (res.data) {
      state.settings = {
        fuelPrice: res.data.fuel_price,
        consumption: res.data.consumption,
        distanceKm: res.data.distance_km
      };
    }
  }

  async function saveSettingsToCloud() {
    var userRes = await supabase.auth.getUser();
    var user = userRes.data.user;
    if (!user) return;
    var res = await supabase.from("settings").upsert({
      user_id: user.id,
      fuel_price: state.settings.fuelPrice,
      consumption: state.settings.consumption,
      distance_km: state.settings.distanceKm
    });
    if (res.error) console.error(res.error);
  }

  function showScreen(id) {
    document.querySelectorAll(".screen").forEach(function (el) { el.classList.remove("active"); });
    document.getElementById(id).classList.add("active");
  }

  // ---------- Monday-start week helpers ----------
  function mondayOfWeek(d) {
    var date = new Date(d);
    var day = date.getDay(); // 0 = Sun
    var diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }

  function currentWeekDates() {
    var mon = mondayOfWeek(new Date());
    var arr = [];
    for (var i = 0; i < 5; i++) {
      var d = new Date(mon);
      d.setDate(mon.getDate() + i);
      arr.push(d);
    }
    return arr;
  }

  // ---------- Rendering: header ----------
  function renderHeader() {
    document.getElementById("header-username").textContent = state.user || "Uživatel";
    document.getElementById("avatar-initial").textContent = (state.user || "U").trim().charAt(0).toUpperCase() || "U";
    var today = new Date();
    var opts = { weekday: "long", day: "numeric", month: "numeric" };
    document.getElementById("header-date").textContent = today.toLocaleDateString("cs-CZ", opts);
  }

  // ---------- Rendering: week pills ----------
  function renderWeekPills() {
    var container = document.getElementById("week-pills");
    container.innerHTML = "";
    var week = currentWeekDates();
    var today = startOfToday();

    if (!state.selectedDate || state.selectedDate > today) {
      var pick = today;
      var isWeekday = today.getDay() >= 1 && today.getDay() <= 5;
      if (!isWeekday) { pick = week[4]; }
      state.selectedDate = pick;
    }

    week.forEach(function (d, i) {
      var btn = document.createElement("button");
      btn.className = "pill-day";
      btn.type = "button";
      btn.textContent = WEEKDAY_LABELS[i];
      if (!isEditableDate(d)) btn.disabled = true;
      if (sameDay(d, state.selectedDate)) btn.classList.add("selected");
      btn.addEventListener("click", function () {
        state.selectedDate = d;
        renderAll();
      });
      container.appendChild(btn);
    });
  }

  // ---------- Rendering: TAM/ZPĚT buttons ----------
  function renderLegButtons() {
    var key = toKey(state.selectedDate);
    var entry = state.rides[key] || { tam: false, zpet: false };
    var tamBtn = document.getElementById("btn-tam");
    var zpetBtn = document.getElementById("btn-zpet");
    tamBtn.classList.toggle("on", !!entry.tam);
    zpetBtn.classList.toggle("on", !!entry.zpet);

    var today = startOfToday();
    var editable = isEditableDate(state.selectedDate);
    tamBtn.disabled = !editable;
    zpetBtn.disabled = !editable;

    var note = document.getElementById("selected-day-note");
    var label = state.selectedDate.toLocaleDateString("cs-CZ", { day: "numeric", month: "numeric" });
    if (state.selectedDate > today) {
      note.textContent = "Tenhle den ještě nenastal";
    } else if (!editable) {
      note.textContent = "Lze zapisovat jen za dnešek a včerejšek (" + label + " je jen k nahlédnutí)";
    } else if (sameDay(state.selectedDate, today)) {
      note.textContent = "Zaznamenáváš jízdu na dnešek (" + label + ")";
    } else {
      note.textContent = "Zaznamenáváš jízdu na včerejšek (" + label + ")";
    }
  }

  function toggleLeg(leg) {
    if (!isEditableDate(state.selectedDate)) return;
    var key = toKey(state.selectedDate);
    var entry = state.rides[key] || { tam: false, zpet: false };
    entry[leg] = !entry[leg];
    if (!entry.tam && !entry.zpet) {
      delete state.rides[key];
    } else {
      state.rides[key] = entry;
    }
    saveRideToCloud(key, entry).catch(function (e) { console.error(e); });
    renderAll();
  }

  // ---------- Rendering: calendar ----------
  function renderCalendar() {
    var label = MONTH_NAMES[state.viewMonth] + " " + state.viewYear;
    document.getElementById("cal-month-label").textContent = label;

    var firstOfMonth = new Date(state.viewYear, state.viewMonth, 1);
    var daysInMonth = new Date(state.viewYear, state.viewMonth + 1, 0).getDate();
    var startWeekday = firstOfMonth.getDay(); // 0 = Sun
    var leadingBlanks = (startWeekday === 0) ? 6 : startWeekday - 1;

    var grid = document.getElementById("day-grid");
    grid.innerHTML = "";

    for (var b = 0; b < leadingBlanks; b++) {
      var pad0 = document.createElement("div");
      pad0.className = "day-cell pad";
      grid.appendChild(pad0);
    }

    var today = startOfToday();
    var totalLegs = 0;

    for (var day = 1; day <= daysInMonth; day++) {
      var d = new Date(state.viewYear, state.viewMonth, day);
      var key = toKey(d);
      var entry = state.rides[key] || { tam: false, zpet: false };
      if (entry.tam) totalLegs++;
      if (entry.zpet) totalLegs++;

      var cell = document.createElement("button");
      cell.type = "button";
      cell.className = "day-cell";
      cell.setAttribute("data-tam", entry.tam ? "1" : "0");
      cell.setAttribute("data-zpet", entry.zpet ? "1" : "0");
      if (sameDay(d, today)) cell.classList.add("is-today");
      if (sameDay(d, state.selectedDate)) cell.classList.add("is-selected");
      if (d > today) cell.disabled = true;

      var num = document.createElement("span");
      num.className = "day-num";
      num.textContent = day;

      var halfL = document.createElement("span"); halfL.className = "half half-left";
      var halfR = document.createElement("span"); halfR.className = "half half-right";

      cell.appendChild(halfL);
      cell.appendChild(halfR);
      cell.appendChild(num);

      (function (dateForCell) {
        cell.addEventListener("click", function () {
          state.selectedDate = dateForCell;
          renderAll();
        });
      })(d);

      grid.appendChild(cell);
    }

    document.getElementById("cal-stat-value").textContent = totalLegs + (totalLegs === 1 ? " jízda" : (totalLegs >= 2 && totalLegs <= 4 ? " jízdy" : " jízd"));

    var today2 = startOfToday();
    document.getElementById("btn-next-month").disabled =
      (state.viewYear > today2.getFullYear()) ||
      (state.viewYear === today2.getFullYear() && state.viewMonth >= today2.getMonth());

    state.monthLegs = totalLegs;
    computeCost();
  }

  // ---------- Cost card ----------
  function fillCostInputs() {
    document.getElementById("input-fuel-price").value = state.settings.fuelPrice;
    document.getElementById("input-consumption").value = state.settings.consumption;
    document.getElementById("input-distance").value = state.settings.distanceKm;
  }

  function computeCost() {
    var fuelInput = document.getElementById("input-fuel-price");
    var consInput = document.getElementById("input-consumption");
    var distInput = document.getElementById("input-distance");
    if (!fuelInput) return; // dashboard not rendered yet

    var fuel = parseFloat(fuelInput.value);
    var cons = parseFloat(consInput.value);
    var dist = parseFloat(distInput.value);
    if (isNaN(fuel) || fuel < 0) fuel = 0;
    if (isNaN(cons) || cons < 0) cons = 0;
    if (isNaN(dist) || dist < 0) dist = 0;

    var changed = fuel !== state.settings.fuelPrice || cons !== state.settings.consumption || dist !== state.settings.distanceKm;
    state.settings = { fuelPrice: fuel, consumption: cons, distanceKm: dist };
    if (changed && state.user) {
      saveSettingsToCloud().catch(function (e) { console.error(e); });
    }

    var costPerLeg = dist * (cons / 100) * fuel;
    var total = costPerLeg * (state.monthLegs || 0);
    document.getElementById("cost-total-value").textContent = Math.round(total).toLocaleString("cs-CZ") + " Kč";
  }

  function renderAll() {
    renderHeader();
    renderWeekPills();
    renderLegButtons();
    renderCalendar();
  }

  // ---------- Auth flow (Supabase) ----------
  function openAuth(mode) {
    authMode = mode;
    document.getElementById("auth-title").textContent = mode === "register" ? "Register" : "Login";
    document.getElementById("email-input").value = "";
    document.getElementById("password-input").value = "";
    document.getElementById("auth-error").textContent = "";
    showScreen("screen-auth");
    document.getElementById("email-input").focus();
  }

  async function confirmAuth() {
    var email = document.getElementById("email-input").value.trim();
    var password = document.getElementById("password-input").value;
    var errorEl = document.getElementById("auth-error");
    errorEl.textContent = "";

    if (!email || !password) {
      errorEl.textContent = "Vyplň e-mail i heslo.";
      return;
    }

    var confirmBtn = document.getElementById("btn-confirm-auth");
    confirmBtn.disabled = true;

    var result = (authMode === "register")
      ? await supabase.auth.signUp({ email: email, password: password })
      : await supabase.auth.signInWithPassword({ email: email, password: password });

    confirmBtn.disabled = false;

    if (result.error) {
      errorEl.textContent = result.error.message;
      return;
    }
    if (!result.data.user) {
      errorEl.textContent = "Zkontroluj e-mail a potvrď registraci, pak se přihlas.";
      return;
    }

    state.user = result.data.user.email;
    state.viewYear = new Date().getFullYear();
    state.viewMonth = new Date().getMonth();
    state.selectedDate = null;

    await loadRidesFromCloud();
    await loadSettingsFromCloud();
    fillCostInputs();
    renderAll();
    showScreen("screen-dashboard");
  }

  function logout() {
    supabase.auth.signOut();
    state.user = null;
    state.rides = {};
    showScreen("screen-welcome");
  }

  // ---------- Wire up events ----------
  document.getElementById("btn-go-login").addEventListener("click", function () { openAuth("login"); });
  document.getElementById("btn-go-register").addEventListener("click", function () { openAuth("register"); });
  document.getElementById("btn-back-welcome").addEventListener("click", function () { showScreen("screen-welcome"); });
  document.getElementById("btn-confirm-auth").addEventListener("click", confirmAuth);
  ["email-input", "password-input"].forEach(function (id) {
    document.getElementById(id).addEventListener("keydown", function (e) {
      if (e.key === "Enter") confirmAuth();
    });
  });
  document.getElementById("btn-logout").addEventListener("click", logout);
  document.getElementById("btn-tam").addEventListener("click", function () { toggleLeg("tam"); });
  document.getElementById("btn-zpet").addEventListener("click", function () { toggleLeg("zpet"); });

  ["input-fuel-price", "input-consumption", "input-distance"].forEach(function (id) {
    document.getElementById(id).addEventListener("input", computeCost);
  });

  document.getElementById("btn-prev-month").addEventListener("click", function () {
    state.viewMonth--;
    if (state.viewMonth < 0) { state.viewMonth = 11; state.viewYear--; }
    renderCalendar();
  });
  document.getElementById("btn-next-month").addEventListener("click", function () {
    var today = startOfToday();
    if (state.viewYear === today.getFullYear() && state.viewMonth >= today.getMonth()) return;
    state.viewMonth++;
    if (state.viewMonth > 11) { state.viewMonth = 0; state.viewYear++; }
    renderCalendar();
  });

  // ---------- Boot ----------
  async function boot() {
    var sessionRes = await supabase.auth.getSession();
    var session = sessionRes.data.session;
    if (session && session.user) {
      state.user = session.user.email;
      await loadRidesFromCloud();
      await loadSettingsFromCloud();
      fillCostInputs();
      renderAll();
      showScreen("screen-dashboard");
    } else {
      showScreen("screen-welcome");
    }
  }
  boot();
})();
</script>
</body>
</html>
